name: disk-cleanup
version: 3.1.0
description: "Auto-track and clean up ephemeral files (test scripts, temp outputs, cron logs) created during Hermes sessions. v3.1.0 adds log retention, backup rotation, and opt-in DB vacuum at session end. Runs via plugin hooks — no agent action required."
author: "@LVT382009 (original), NousResearch (plugin port)"
hooks:
  - post_tool_call
  - on_session_end
